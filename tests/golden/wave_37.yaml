wave: 37
# Golden assertions for wave 37 (2025Q4). Failure modes confirmed in production:
# 1. "recovered" language when net balance still negative (business_situation / profit)
# 2. Numbers cited in bullets must match the data snapshot values
#
# judge_baseline (per section, optional): human-approved LLM-judge scores from
# reports/eval_judge.py, captured by running `python reports/eval_harness.py
# --wave 37 --approve` with live MOTHERDUCK_TOKEN/ANTHROPIC_API_KEY access and
# reviewing the printed scores before confirming. Not yet captured for this
# file — no live pipeline access in the environment that authored this golden
# file. Sections without a judge_baseline are skipped by the harness's
# judge-score regression check (logged, non-blocking) until one is captured;
# the assertions above already run and block regardless.

sections:
  - section_id: business_situation
    # Wave 37 profit: net -22.4pp (improved from -37.5pp in wave 36, but still negative)
    data_snapshot:
      SK_profit_net_balance_w37: -22.4
      SK_profit_net_balance_w36: -37.5
    assertions:
      # The number 22 (the absolute value) must appear somewhere in the bullets
      - type: contains_number
        value: "22"
      # "recovered" on a still-negative net balance is factually wrong
      - type: not_contains_phrase
        phrase: "recovered"
      - type: not_contains_phrase
        phrase: "recovery"
      - type: not_contains_phrase
        phrase: "rebound"
      - type: not_contains_phrase
        phrase: "turned around"
      # Must use improvement language, not recovery language
      - type: direction_word
        expected: "improv"   # matches "improved", "improving", "improvement"
